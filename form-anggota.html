<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Anggota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img class="gambar-header" src="img/gambar.png" alt="Logo perpustakaan berupa tumpukan buku">
        <div>
            <h1>Formulir Anggota</h1>
        </div>
    </header>

    <main>
        <h3>Isi data berikut untuk melihat profil keanggotaan Anda.</h3>
        <form action="profil-anggota.php" method="post" novalidate>
            <p>
                <label for="nama">Nama lengkap</label>
                <input type="text" id="nama" name="nama" maxlength="100" required>
            </p>
            
            <p>
                <label for="nomor">Nomor anggota / NIM</label>
                <input type="text" id="nomor" name="nomor" maxlength="30" required>
            </p>

            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" maxlength="100" required>
            </p>
            
            <p>
                <label for="unit">Unit / Program studi</label>
                <input type="text" id="unit" name="programStudi" maxlength="100" required>
            </p>
            
            <p>
                <label for="kategori">Kategori anggota</label>
                <select id="kategori" name="kategori" required>
                    <option value="">-- Pilih kategori --</option>
                    <option value="Mahasiswa">Mahasiswa</option>
                    <option value="Dosen">Dosen</option>
                    <option value="Umum">Umum</option>
                </select>
            </p>
            

            <div class="aksi">
                <button type="submit">Lihat profil</button>
                <button type="reset" class="btn-reset">Kosongkan isian</button>
            </div>
        </form>
        <br>

        <a class="kembali" href="index.html">Kembali ke halaman utama</a>
    </main>

    <footer>
        <p>Pemrograman Web &middot; Kelas C &middot; @2026</p>
    </footer>
</body>
</html>
